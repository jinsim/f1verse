[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "f1verse"
dynamic = ["version"]
description = "The story layer for Formula 1 data — zero-dependency race narratives: lead changes, stints, race pace, live championship projection, team radio index."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.9"
authors = [{ name = "f1verse contributors" }]
keywords = [
  "f1", "formula1", "formula-1", "motorsport", "racing", "grand-prix",
  "telemetry", "live-timing", "race-analysis", "data-analysis",
  "mcp", "mcp-server", "llm", "agent", "ai-tools", "zero-dependency",
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3 :: Only",
  "Topic :: Scientific/Engineering :: Information Analysis",
  "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = []

[project.optional-dependencies]
test = ["pytest>=7"]

[project.scripts]
f1verse-mcp = "f1verse.mcp:main"

[project.urls]
Homepage = "https://github.com/jinsim/f1verse"
Documentation = "https://jinsim.github.io/f1verse/"
Source = "https://github.com/jinsim/f1verse"
Issues = "https://github.com/jinsim/f1verse/issues"
Changelog = "https://github.com/jinsim/f1verse/releases"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.dynamic]
version = {attr = "f1verse._version.__version__"}
