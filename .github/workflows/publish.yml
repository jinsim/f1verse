# PyPI Trusted Publishing — no API token stored anywhere.
# One-time setup on pypi.org: Account → Publishing → add pending publisher
#   project: f1verse / owner: jinsim / repo: f1verse
#   workflow: publish.yml / environment: pypi
# Then publishing = pushing a version tag:  git tag v0.3.0 && git push --tags
name: publish
on:
  push:
    tags: ["v*"]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install build && python -m build
      - uses: actions/upload-artifact@v4
        with: { name: dist, path: dist/ }
  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write   # OIDC — this is what replaces the token
    steps:
      - uses: actions/download-artifact@v4
        with: { name: dist, path: dist/ }
      - uses: pypa/gh-action-pypi-publish@release/v1
