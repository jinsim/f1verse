name: test
on:
  push:
    branches: [main]
  pull_request:
jobs:
  pytest:
    # Python 3.9 has upstream runner builds through Ubuntu 24.04.
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      matrix:
        python-version: ["3.9", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -e . pytest
      # Fast deterministic validation on ordinary changes. The tag workflow
      # keeps the full network-backed matrix as a required publication gate.
      - run: pytest -q --offline
